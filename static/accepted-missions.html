<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpMe – Mes missions</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: var(--bg); }
    .vol-main { overflow-y: auto; }
    .page-body { padding: 24px 28px; max-width: 860px; }
    @media (max-width: 768px) { .page-body { padding: 16px; } }

    .tab-row { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
    .tab-btn { flex-shrink: 0; padding: 9px 18px; border-radius: 999px; border: 1.5px solid var(--border); background: #fff; font: 600 .85rem 'Inter',sans-serif; cursor: pointer; transition: all .15s; color: #374151; }
    .tab-btn.active { background: #1f2937; color: #fff; border-color: #1f2937; }

    .mission-card { background: #fff; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px; transition: box-shadow .2s; }
    .mission-card:hover { box-shadow: var(--shadow-hover); }
    .mission-header { padding: 16px 18px; display: flex; align-items: flex-start; gap: 14px; }
    .mission-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
    .mission-body  { flex: 1; min-width: 0; }
    .mission-title { font-weight: 700; font-size: 1rem; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mission-desc  { font-size: .83rem; color: var(--muted); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .mission-meta  { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
    .mission-meta span { display: flex; align-items: center; gap: 4px; }
    .mission-footer { padding: 12px 18px; border-top: 1px solid var(--border-soft); background: #fafafa; display: flex; align-items: center; gap: 10px; }

    /* Review stars */
    .star-row { display: flex; gap: 5px; }
    .star-btn-r { background: none; border: none; font-size: 1.4rem; color: #d1d5db; cursor: pointer; padding: 2px; transition: color .1s; }
    .star-btn-r.active, .star-btn-r:hover { color: #f59e0b; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 14px; }

    .skeleton-card { background: #fff; border-radius: 20px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 14px; }
  </style>
</head>
<body class="animate-fade">
<div class="vol-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#4338ca);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem">💙</div>
        <span style="font-weight:800;font-size:1.1rem">HelpMe</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="/volunteer-dashboard.html"><span class="s-icon">🏠</span>Tableau de bord</a>
      <a class="sidebar-link" href="/missions.html"><span class="s-icon">📋</span>Missions disponibles</a>
      <a class="sidebar-link active" href="/accepted-missions.html"><span class="s-icon">✅</span>Mes missions</a>
      <a class="sidebar-link" href="#" id="logout-link"><span class="s-icon">👋</span>Déconnexion</a>
    </nav>
    <div style="padding:16px;border-top:1px solid var(--border-soft)">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="avatar avatar-sm" id="user-av">?</div>
        <div style="overflow:hidden">
          <div id="user-name" style="font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">…</div>
          <div style="font-size:.75rem;color:var(--muted)">Bénévole</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="vol-main">
    <div class="vol-topbar">
      <div>
        <h2 style="font-size:1.2rem">Mes missions acceptées</h2>
        <p id="count-label" style="color:var(--muted);font-size:.83rem">Chargement…</p>
      </div>
    </div>

    <div class="page-body animate-slide">

      <!-- Status tabs -->
      <div class="tab-row" id="tab-row">
        <button class="tab-btn active" data-status="all">Toutes</button>
        <button class="tab-btn" data-status="accepted">✅ Acceptées</button>
        <button class="tab-btn" data-status="in_progress">🔵 En cours</button>
        <button class="tab-btn" data-status="completed">🏆 Terminées</button>
      </div>

      <!-- Skeletons -->
      <div id="list">
        <div class="skeleton-card"><div class="skeleton" style="height:18px;width:55%;margin-bottom:10px"></div><div class="skeleton" style="height:13px;width:80%"></div></div>
        <div class="skeleton-card"><div class="skeleton" style="height:18px;width:65%;margin-bottom:10px"></div><div class="skeleton" style="height:13px;width:75%"></div></div>
      </div>

    </div>
  </div>
</div>

<script src="/accepted-missions.js"></script>
</body>
</html>
