<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpMe – Connexion</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; padding:24px; }
    .container { width:100%; max-width:420px; }
    .back-btn { display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--muted); font:500 .93rem 'Inter',sans-serif; cursor:pointer; padding:0; margin-bottom:32px; transition:color .2s; }
    .back-btn:hover { color:var(--text); }
    .auth-icon { width:64px; height:64px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:2rem; margin:0 auto 16px; }
    .hdr { text-align:center; margin-bottom:28px; }
    .hdr h1 { font-size:1.8rem; margin-bottom:4px; }
    .hdr p  { color:var(--muted); font-size:.95rem; }
    .form-card { background:#fff; border-radius:28px; box-shadow:var(--shadow); padding:28px; }
    .form-fields { display:flex; flex-direction:column; gap:16px; }
    .toggle-row { text-align:center; margin-top:20px; font-size:.88rem; color:var(--muted); }
    .toggle-btn { background:none; border:none; font-family:inherit; font-size:inherit; font-weight:700; cursor:pointer; padding:0; transition:color .15s; }
    .trusted { display:flex; justify-content:center; gap:24px; margin-top:20px; font-size:.78rem; color:var(--muted); }
    .trusted span { display:flex; align-items:center; gap:5px; }
    .pw-wrap { position:relative; }
    .pw-toggle { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1rem; color:#9ca3af; padding:4px; }
  </style>
</head>
<body class="bg-auth animate-fade">
  <div class="container animate-slide">
    <button class="back-btn" onclick="history.back()">← Retour</button>

    <div class="hdr">
      <div class="auth-icon" id="auth-icon">🤝</div>
      <h1 id="auth-title">Bon retour !</h1>
      <p id="auth-sub">Connexion en tant que <strong id="role-label" style="color:var(--accent)">Bénévole</strong></p>
    </div>

    <div class="form-card">
      <form id="auth-form" class="form-fields">
        <div class="input-wrap" id="name-wrap" style="display:none">
          <label for="name">Nom complet</label>
          <div class="input-icon-wrap">
            <span class="input-icon">👤</span>
            <input id="name" type="text" class="input-field" placeholder="Votre nom" autocomplete="name">
          </div>
        </div>

        <div class="input-wrap">
          <label for="email">Adresse e-mail</label>
          <div class="input-icon-wrap">
            <span class="input-icon">✉️</span>
            <input id="email" type="email" class="input-field" placeholder="vous@email.com" required autocomplete="email">
          </div>
        </div>

        <div class="input-wrap">
          <label for="password">Mot de passe</label>
          <p id="pw-hint" style="display:none;font-size:.78rem;color:var(--muted);margin-bottom:4px">Minimum 8 caractères</p>
          <div class="pw-wrap">
            <input id="password" type="password" class="input-field" placeholder="Votre mot de passe" required autocomplete="current-password" style="padding-right:44px">
            <button type="button" class="pw-toggle" id="pw-toggle" title="Afficher/Masquer">👁</button>
          </div>
        </div>

        <div id="status-msg" style="display:none"></div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-lg btn-full">
          <span id="btn-label">Se connecter</span>
          <span id="btn-spin" class="spinner" style="display:none"></span>
        </button>
      </form>

      <div class="toggle-row">
        <span id="toggle-text">Pas encore de compte ?</span>
        <button class="toggle-btn" id="toggle-btn" style="color:var(--accent)">Créer un compte</button>
      </div>
    </div>

    <div class="trusted">
      <span>🔒 Sécurisé &amp; Privé</span>
      <span>💙 100% Gratuit</span>
    </div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
