<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpMe – Chat</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    /* ── LAYOUT ── */
    .chat-layout { display: flex; height: 100vh; overflow: hidden; }

    /* ── HISTORY PANEL ── */
    .history-panel {
      width: 260px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .history-header { padding: 16px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: space-between; }
    .history-header h3 { font-size: .95rem; }
    .history-list { flex: 1; overflow-y: auto; padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; }
    .history-empty { padding: 24px 16px; text-align: center; color: var(--muted); font-size: .85rem; }
    @media (max-width: 640px) { .history-panel { display: none; } }

    /* ── CHAT PANEL ── */
    .chat-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f8fafc; }

    /* Top bar */
    .chat-topbar {
      background: #fff; padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 14px; flex-shrink: 0;
    }
    .bot-avatar { width: 42px; height: 42px; border-radius: 14px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
    .bot-name  { font-weight: 700; font-size: 1rem; }
    .bot-status { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--success); font-weight: 500; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
    .topbar-actions { margin-left: auto; display: flex; gap: 8px; }

    /* Messages */
    .messages-area { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
    .msg-row { display: flex; align-items: flex-end; gap: 10px; }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: .85rem; font-weight: 700; flex-shrink: 0; }
    .msg-avatar.bot  { background: var(--accent); color: #fff; }
    .msg-avatar.user { background: #e5e7eb; color: #374151; }
    .msg-content { display: flex; flex-direction: column; gap: 3px; max-width: 74%; }
    .msg-row.user .msg-content { align-items: flex-end; }

    /* Typing indicator */
    .typing-wrap { display: flex; align-items: center; gap: 6px; padding: 12px 16px; background: #fff; border-radius: 18px; border-bottom-left-radius: 6px; box-shadow: var(--shadow-soft); width: fit-content; }

    /* Composer */
    .composer { background: #fff; border-top: 1px solid var(--border); padding: 14px 16px; flex-shrink: 0; }
    .composer-row { display: flex; align-items: flex-end; gap: 10px; }
    .msg-textarea {
      flex: 1; resize: none; border: 1.5px solid var(--border); border-radius: 18px;
      padding: 12px 16px; font: 400 .97rem/1.5 'Inter',sans-serif; color: var(--text);
      max-height: 140px; outline: none; transition: border-color .2s, box-shadow .2s;
      background: #f8fafc;
    }
    .msg-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,142,247,.12); background: #fff; }
    .send-btn { width: 44px; height: 44px; border-radius: 14px; border: none; background: var(--accent); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; transition: all .2s; box-shadow: 0 4px 14px rgba(79,142,247,.35); }
    .send-btn:hover { background: var(--accent-dark); transform: scale(1.05); }
    .send-btn:disabled { opacity: .5; transform: none; cursor: not-allowed; }
    .mic-btn { width: 44px; height: 44px; border-radius: 14px; border: none; background: #f3f4f6; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; transition: all .2s; }
    .mic-btn:hover { background: var(--accent-light); }
    .mic-btn.listening { background: #fef2f2; animation: pulse-red 1.2s ease infinite; }
    @keyframes pulse-red { 0%,100% { box-shadow:0 0 0 0 rgba(220,38,38,.4); } 50% { box-shadow:0 0 0 8px rgba(220,38,38,.0); } }
    .composer-hints { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: .78rem; color: var(--muted); }
    .mic-transcript { flex: 1; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Success banner */
    .success-banner { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; padding: 16px 18px; margin: 0 16px 16px; border-radius: 20px; display: flex; align-items: center; gap: 14px; animation: slideUp .4s ease; }
    .success-banner h4 { font-size: 1rem; margin-bottom: 2px; }
    .success-banner p  { font-size: .82rem; opacity: .88; }

    /* Mobile back link */
    .back-mobile { display: none; background: none; border: none; color: var(--muted); font-size: .9rem; cursor: pointer; padding: 6px 0; }
    @media (max-width: 640px) { .back-mobile { display: inline-flex; align-items: center; gap: 6px; } }
  </style>
</head>
<body class="animate-fade">
  <div class="chat-layout">

    <!-- ── HISTORY SIDEBAR ── -->
    <aside class="history-panel">
      <div class="history-header">
        <h3>💬 Conversations</h3>
        <button class="btn btn-sm btn-primary" id="new-chat-btn" title="Nouvelle conversation">+</button>
      </div>
      <div class="history-list" id="history-list">
        <div class="history-empty">Chargement…</div>
      </div>
    </aside>

    <!-- ── CHAT PANEL ── -->
    <div class="chat-panel">

      <!-- Top bar -->
      <div class="chat-topbar">
        <button class="back-mobile" onclick="window.location.href='/elderly-home.html'">← Accueil</button>
        <div class="bot-avatar">🤖</div>
        <div>
          <div class="bot-name">Assistant IA</div>
          <div class="bot-status"><span class="status-dot"></span>Toujours disponible</div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-sm btn-ghost" id="tts-toggle" title="Activer/Désactiver la lecture vocale">🔊</button>
          <button class="btn btn-sm btn-ghost" id="new-chat-btn2">＋ Nouveau</button>
          <button class="btn btn-sm btn-ghost" onclick="window.location.href='/elderly-home.html'">🏠</button>
        </div>
      </div>

      <!-- Success banner (hidden by default) -->
      <div id="success-banner" style="display:none" class="success-banner">
        <span style="font-size:2rem">🎉</span>
        <div>
          <h4>Demande envoyée !</h4>
          <p>Un bénévole va vous contacter très bientôt.</p>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages-area" id="messages"></div>

      <!-- Composer -->
      <div class="composer">
        <div class="composer-hints">
          <span class="mic-transcript" id="transcript-hint">Appuyez sur 🎤 pour dicter, ou tapez ci-dessous…</span>
        </div>
        <div class="composer-row">
          <button class="mic-btn" id="mic-btn" title="Dicter">🎤</button>
          <textarea class="msg-textarea" id="msg-input" rows="1" placeholder="Tapez votre message…" disabled></textarea>
          <button class="send-btn" id="send-btn" disabled>➤</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/chat.js"></script>
</body>
</html>
