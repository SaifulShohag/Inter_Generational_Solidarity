<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpMe – Bienvenue</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .logo { width: 72px; height: 72px; border-radius: 24px; background: linear-gradient(135deg, #4F8EF7, #6366f1); display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 12px 32px rgba(79,142,247,.4); margin-bottom: 20px; }
    .tagline { color: var(--muted); text-align: center; max-width: 34ch; font-size: 1.05rem; margin-top: 8px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 640px; margin: 40px 0 32px; }
    @media (max-width: 520px) { .cards { grid-template-columns: 1fr; } }
    .role-card {
      border: 2px solid transparent; border-radius: 28px; padding: 28px; background: #fff;
      box-shadow: var(--shadow); cursor: pointer; text-align: left; transition: all .25s;
      position: relative; overflow: hidden;
    }
    .role-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
    .role-card.volunteer:hover { border-color: var(--accent); }
    .role-card.elderly:hover   { border-color: var(--success); }
    .role-card .blob {
      position: absolute; top: -24px; right: -24px; width: 96px; height: 96px;
      border-radius: 50%; transition: transform .4s;
    }
    .role-card:hover .blob { transform: scale(1.4); }
    .volunteer .blob { background: radial-gradient(circle, rgba(79,142,247,.18), rgba(99,102,241,.08)); }
    .elderly   .blob { background: radial-gradient(circle, rgba(22,163,74,.18), rgba(34,197,94,.08)); }
    .role-emoji { width: 68px; height: 68px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin-bottom: 16px; }
    .volunteer .role-emoji { background: var(--accent-light); }
    .elderly   .role-emoji { background: var(--success-light); }
    .role-title { font-size: 1.35rem; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .role-desc  { font-size: .9rem; color: var(--muted); line-height: 1.5; margin-bottom: 16px; }
    .role-cta   { display: flex; align-items: center; gap: 6px; font-size: .9rem; font-weight: 700; }
    .volunteer .role-cta { color: var(--accent); }
    .elderly   .role-cta { color: var(--success); }
    .role-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .role-chip  { padding: 4px 10px; background: #f3f4f6; border-radius: 999px; font-size: .76rem; color: #374151; font-weight: 500; }
    .footer-badges { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; color: var(--muted); font-size: .85rem; }
    .footer-badges span { display: flex; align-items: center; gap: 6px; }
    .hdr { text-align: center; }
  </style>
</head>
<body class="bg-auth animate-fade">
  <header class="hdr">
    <div class="logo">💙</div>
    <h1 style="letter-spacing:-0.03em">HelpMe</h1>
    <p class="tagline">Aider les seniors grâce à une communication accessible propulsée par l'IA.</p>
  </header>

  <div class="cards animate-slide">
    <button class="role-card volunteer" onclick="go('volunteer')">
      <div class="blob"></div>
      <div class="role-emoji">🤝</div>
      <p class="role-title">Je suis bénévole</p>
      <p class="role-desc">Aidez les personnes âgées de votre communauté et faites une vraie différence chaque jour.</p>
      <div class="role-cta">Commencer <span>→</span></div>
      <div class="role-chips">
        <span class="role-chip">🌟 1 200+ bénévoles</span>
        <span class="role-chip">⭐ 4,9 noté</span>
      </div>
    </button>

    <button class="role-card elderly" onclick="go('elderly')">
      <div class="blob"></div>
      <div class="role-emoji">👴</div>
      <p class="role-title">Je suis un senior</p>
      <p class="role-desc">Obtenez de l'aide quand vous en avez besoin, de façon simple et naturelle.</p>
      <div class="role-cta" style="color:var(--success)">Commencer <span>→</span></div>
      <div class="role-chips">
        <span class="role-chip">🎤 Vocal &amp; texte</span>
        <span class="role-chip">✅ Toujours disponible</span>
      </div>
    </button>
  </div>

  <div class="footer-badges animate-fade">
    <span>👥 Rejoignez 5 000+ membres</span>
    <span>✨ Communication par IA</span>
    <span>💙 Fait avec soin</span>
  </div>

  <script src="/index.js"></script>
</body>
</html>
