<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpMe – Missions</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: var(--bg); }
    .vol-main { overflow-y: auto; }
    .page-body { padding: 24px 28px; max-width: 860px; }
    @media (max-width: 768px) { .page-body { padding: 16px; } }
    .search-bar { display: flex; gap: 10px; margin-bottom: 18px; }
    .search-bar .input-field { flex: 1; }
    .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip { flex-shrink: 0; padding: 7px 16px; border-radius: 999px; border: 1.5px solid var(--border); background: #fff; font: 500 .83rem 'Inter',sans-serif; cursor: pointer; transition: all .15s; color: #374151; }
    .filter-chip.active { background: #1f2937; color: #fff; border-color: #1f2937; }
    .filter-chip.active-accent { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
    .type-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .type-chip { padding: 10px 8px; border-radius: 16px; border: 2px solid var(--border); background: #fff; cursor: pointer; text-align: center; font: 600 .78rem 'Inter',sans-serif; transition: all .15s; color: #374151; }
    .type-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .type-chip .type-icon { font-size: 1.3rem; display: block; margin-bottom: 3px; }
    .missions-list { display: flex; flex-direction: column; gap: 12px; }
    .mission-item { background: #fff; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; cursor: pointer; transition: all .2s; }
    .mission-item:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
    .mission-body { padding: 16px; }
    .mission-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
    .mission-desc  { font-size: .85rem; color: var(--muted); margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .mission-meta  { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
    .mission-meta span { display: flex; align-items: center; gap: 4px; }
    .mission-actions { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border-soft); background: #fafafa; }
    .count-label { font-size: .85rem; color: var(--muted); font-weight: 500; margin-bottom: 14px; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  </style>
</head>
<body class="animate-fade">
  <div class="vol-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#4338ca);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem">💙</div>
          <span style="font-weight:800;font-size:1.1rem">HelpMe</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="/volunteer-dashboard.html"><span class="s-icon">🏠</span>Tableau de bord</a>
        <a class="sidebar-link active" href="/missions.html"><span class="s-icon">📋</span>Missions disponibles</a>
        <a class="sidebar-link" href="/accepted-missions.html"><span class="s-icon">✅</span>Mes missions</a>
        <a class="sidebar-link" href="#" id="logout-link"><span class="s-icon">👋</span>Déconnexion</a>
      </nav>
    </aside>

    <div class="vol-main">
      <div class="vol-topbar">
        <div>
          <h2 style="font-size:1.2rem">Missions disponibles</h2>
          <p style="color:var(--muted);font-size:.83rem">📍 Près de vous</p>
        </div>
      </div>

      <div class="page-body animate-slide">
        <!-- Search -->
        <div class="search-bar">
          <input id="search" type="text" class="input-field" placeholder="🔍 Rechercher une mission…">
        </div>

        <!-- Category filter -->
        <div class="filter-row" id="cat-filter"></div>

        <!-- Priority filter -->
        <div class="filter-row" id="pri-filter"></div>

        <p class="count-label" id="count-label">Chargement…</p>

        <div class="missions-list" id="missions-list">
          <div style="background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:12px"><div class="skeleton" style="height:18px;width:55%;margin-bottom:10px"></div><div class="skeleton" style="height:13px;width:80%"></div></div>
          <div style="background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow)"><div class="skeleton" style="height:18px;width:65%;margin-bottom:10px"></div><div class="skeleton" style="height:13px;width:75%"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/missions.js"></script>
</body>
</html>
