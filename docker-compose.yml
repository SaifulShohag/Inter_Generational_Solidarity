services:
  backend:
    build: ./backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/helpme.db
      CONVERSATIONS_DIR: /data/conversations
    volumes:
      - app_data:/data
      - ./backend:/app    # <--- ADD THIS LINE
    restart: unless-stopped

  frontend:
    build:
      context: ./vibeforall
      args:
        VITE_API_URL: ""
    ports:
      - "5776:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app_data: